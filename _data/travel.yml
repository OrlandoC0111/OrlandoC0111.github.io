# Places I have been. This feeds the map on the "Ten Thousand Miles" page (/travel/).
# status: lived | visited | favorite   (places can also be "born")

# 1) Whole countries / regions to shade. Names as in assets/data/country-names.txt.
#    part_of: counts the region under another country in the stats.
countries:
  - {name: Taiwan, status: favorite}
  - {name: Hong Kong, status: visited, part_of: China}
  - {name: Qatar, status: visited}

# 2) States and provinces to shade (United States, Canada, China only).
#    Names as in assets/data/regions-usa-can-chn.json (e.g. Québec, Tibet, District of Columbia).
states:
  United States of America:
    lived: [New York, North Carolina, Virginia]
    visited: [Massachusetts, Pennsylvania, District of Columbia, Washington, Oregon, Texas,
              California, Georgia, Illinois, Wisconsin, Florida]
  Canada:
    visited: [Québec, Ontario, British Columbia]
  China:
    lived: [Shandong, Zhejiang]
    visited: [Beijing, Henan, Jiangsu, Fujian, Guangdong, Hunan, Hebei, Liaoning, Heilongjiang,
              Jilin, Qinghai, Gansu, Ningxia, Tibet, Yunnan, Hainan,
              Inner Mongolia, Sichuan, Shanghai]

